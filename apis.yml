name: Beesafe Ai
description: >-
  Beesafe AI is a fraud-prevention and anti-scam platform whose tagline is
  "Stopping Scams Before They Reach Your Customers." Its AI-powered anti-scam
  agents proactively engage scammers to uncover the fraudulent accounts,
  money-mule networks, and criminal financial infrastructure behind trust-based
  scams such as romance scams, pig-butchering, and investment fraud, which
  bypass traditional detection by convincing victims to authorize transactions
  themselves. Beesafe serves financial-services firms, cryptocurrency companies,
  telecommunications providers, and government agencies. It was founded by AI and
  security PhDs from Carnegie Mellon and UC San Diego and is backed by Y
  Combinator, Obvious Ventures, and SBIR/STTR funding. The platform is currently
  in early access with no public self-service API, developer documentation, or
  pricing published.
